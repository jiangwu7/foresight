[versions]
agp = "8.11.2"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
coreKtx = "1.15.0"
lifecycle = "2.9.4"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.9.8"
room = "2.8.5"
sqlite = "2.7.1"
